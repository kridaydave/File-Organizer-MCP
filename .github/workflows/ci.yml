name: CI/CD Pipeline

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

# A push to a PR branch fires both `push` and `pull_request`, so one commit used
# to run the whole pipeline twice. PR runs cancel their predecessor; main never
# cancels, so a merge to main always gets a full run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # lint, build and typecheck are platform-independent, so they belong here
  # rather than in all six matrix lanes below, where each repeated them.
  # `test:security:static` reads dist/, so it follows the build.
  static:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # `tsc` is out of the loop: `bun check` type checks and `bun build` emits,
      # which took the build from ~390MB of resident memory to ~140MB. Installs
      # stay on npm so package-lock.json remains the only lockfile. The version
      # is pinned because the build depends on `--no-bundle` transpiling each
      # file in place rather than bundling the graph.
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"

      # Proves the merge gate still asks about every job below, and that each
      # one has a timeout rather than sitting on the runner for six hours.
      - name: Check workflow invariants
        run: npm run check:ci

      - name: Build project
        run: npm run build

      - name: Run linter
        run: npm run lint

      - name: Typecheck src and tests
        run: npm run typecheck:tests

      - name: Run static security analysis
        run: npm run test:security:static

  test:
    name: Test on ${{ matrix.os }} with Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22]

    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: "npm"

      # tests/setup.ts points jest at .jest-cache. Left in place it shortens
      # every run after the first; the old workflow restored it and then
      # deleted it, so it never paid for itself.
      - name: Cache Jest
        uses: actions/cache@v4
        with:
          path: .jest-cache
          key: ${{ runner.os }}-jest-${{ matrix.node }}-${{ hashFiles('**/*.ts') }}
          restore-keys: |
            ${{ runner.os }}-jest-${{ matrix.node }}-

      - name: Install dependencies
        run: npm ci

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"

      # The integration suites spawn the real CLI, which is dist/src/index.js,
      # so a missing build fails them with empty output rather than a clear error.
      - name: Build project
        run: npm run build

      - name: Run security fuzzing & TOCTOU suite (Ubuntu only)
        if: matrix.os == 'ubuntu-latest' && matrix.node == '20'
        run: npm run test:security:gates

      - name: Run test suite
        run: npm test
        env:
          CI: true

      - name: Upload coverage (Ubuntu + Node 20 only)
        if: matrix.os == 'ubuntu-latest' && matrix.node == '20'
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # This job used to carry `continue-on-error: true`, so a high severity
  # advisory could sit open forever and the check stayed green. It now gates.
  # Level is `high`, not `moderate`: sprintf-js is still vulnerable and fixing
  # it means a breaking ts-jest bump, which is its own change.
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=high

  build:
    name: Build and Package
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"

      - name: Build
        run: npm run build

      - name: Package check
        run: |
          npm pack --dry-run
          npm pack

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

      - name: Upload package tarball
        uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: "*.tgz"
          retention-days: 7

  lint-docs:
    name: Lint Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check markdown files
        uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: |
            *.md
            docs/**/*.md
            AGENTS.md
            ARCHITECTURE.md
            API.md
            CHANGELOG.md
            CONTRIBUTING.md
            MIGRATION.md
            SECURITY.md

  # docs:check used to run as the last step of `static`, after typecheck, so a
  # typecheck failure masked it. The same drift was also guarded from inside the
  # jest suite, where one stale count reported on all six matrix lanes. Here it
  # runs unmasked, and the suite keeps only the guards docs:check cannot
  # express (see tests/unit/docs-tool-list.test.ts).
  docs:
    name: Docs Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # docs:check:tool-count builds and reads the registry from dist/, and the
      # build is `bun build --no-bundle`.
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"

      - name: Install dependencies
        run: npm ci

      # Citations resolve, and README/ARCHITECTURE tool facts match the registry.
      - name: Check docs for drift
        run: npm run docs:check

  # One required check, so adding or renaming a job never needs a branch
  # protection edit. `always()` keeps it reporting when a job below failed or
  # was cancelled instead of vanishing, which would block forever.
  check:
    name: Check
    if: ${{ always() }}
    needs: [static, test, security, build, lint-docs, docs]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e 'all(to_entries[]; .value.result == "success")' > /dev/null
